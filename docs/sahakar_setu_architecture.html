<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAHAKAR-SETU: Master Technical System Architecture & Data Flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121820;
      color: #F8FAFC;
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px;
    }
    .toolbar {
      width: 100%;
      max-width: 1920px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      background: #1E293B;
      padding: 12px 24px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .title-group h1 {
      font-size: 18px;
      font-weight: 800;
      color: #38BDF8;
      letter-spacing: 0.5px;
    }
    .title-group p {
      font-size: 12px;
      color: #94A3B8;
    }
    .actions {
      display: flex;
      gap: 12px;
    }
    .btn {
      background: #0284C7;
      color: #FFFFFF;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn:hover {
      background: #0369A1;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: #334155;
      color: #E2E8F0;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .diagram-container {
      width: 100%;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background: #F7F4EB;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      border: 1px solid #475569;
    }
    .diagram-container img, .diagram-container object, .diagram-container svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .fullscreen-mode {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      max-width: none;
      border-radius: 0;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <div class="title-group">
      <h1>SAHAKAR-SETU: MASTER TECHNICAL SYSTEM ARCHITECTURE &amp; DATA FLOW</h1>
      <p>16:9 Production Presentation Blueprint • 5 Architectural Tiers • GovTech India High-Concurrency Infrastructure</p>
    </div>
    <div class="actions">
      <a href="sahakar_setu_architecture.svg" download="sahakar_setu_architecture.svg" class="btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        Download SVG for PPT
      </a>
      <button onclick="toggleFullscreen()" class="btn btn-secondary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        Toggle Fullscreen (16:9)
      </button>
    </div>
  </div>

  <div class="diagram-container" id="diagramWrapper">
    <object data="sahakar_setu_architecture.svg" type="image/svg+xml" width="100%" height="100%"></object>
  </div>

  <script>
    function toggleFullscreen() {
      const container = document.getElementById('diagramWrapper');
      if (!document.fullscreenElement) {
        if (container.requestFullscreen) {
          container.requestFullscreen();
        } else if (container.webkitRequestFullscreen) {
          container.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  </script>
</body>
</html>
